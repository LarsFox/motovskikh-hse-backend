<!DOCTYPE html>
<html lang="ru">

<head>
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/imgn/favicon-16x16.png" />
    <link rel="manifest" href="/img/site.webmanifest" />
    <link rel="mask-icon" href="/img/safari-pinned-tab.svg" color="#5bbad5" />
    <link rel="shortcut icon" href="/img/favicon.ico" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение email в Мастерской</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #080808;
            font-family: "Golos Text", sans-serif;
            color: #e9e9e9;
            min-height: 100vh;
            overflow: hidden;
        }

        .shape {
            opacity: 0.87;
            position: fixed;
            z-index: 1;
        }

        .circle {
            border-radius: 50%;
        }

        .square {
            border-radius: 0;
        }

        .triangle {
            background: transparent;
            border-left-color: transparent;
            border-right-color: transparent;
            border-top-width: 0;
            border-style: solid;
            height: 0;
            width: 0;
            opacity: 0.87;
            position: fixed;
            z-index: 1;
        }

        .triangle.red {
            border-bottom-color: #ff3266;
        }

        .triangle.green {
            border-bottom-color: #2dc4b6;
        }

        .triangle.blue {
            border-bottom-color: #20a4f3;
        }

        .triangle.yellow {
            border-bottom-color: #ffbf69;
        }

        .symmetric.red {
            background: #ff3266;
        }

        .symmetric.green {
            background: #2dc4b6;
        }

        .symmetric.blue {
            background: #20a4f3;
        }

        .symmetric.yellow {
            background: #ffbf69;
        }

        .triangle.western.windy {
            transform: rotate(-540deg);
        }

        .triangle.eastern.windy {
            transform: rotate(540deg);
        }

        .boarder {
            background: rgba(13, 13, 13, 0.72);
            border-radius: 20px;
            display: flex;
            padding: 6px 8px;
            position: fixed;
            right: 1.25%;
            top: 1%;
            z-index: 4;
            align-items: center;
            gap: 8px;
        }

        .boarder a {
            color: #02f0fe;
            text-decoration: none;
            border-bottom: 1px solid rgba(2, 240, 254, 0.5);
            font-size: 17px;
            padding: 3px 5px;
            transition: color 0.21s, border-color 0.21s;
        }

        .boarder a:hover {
            color: #ff3266;
            border-color: rgba(255, 50, 102, 0.5);
        }

        .remal {
            position: relative;
            z-index: 3;
            max-width: 500px;
            margin: 80px auto;
            padding: 0 20px;
        }

        h1 {
            color: #ffbf69;
            font-size: 48px;
            margin-bottom: 32px;
            line-height: 0.9;
        }

        .subtitle {
            color: #aaa;
            font-size: 0.95em;
            margin-bottom: 4px;
        }

        .email-hint {
            color: #e9e9e9;
            font-size: 0.95em;
            margin-bottom: 25px;
        }

        /* 6 инпутов для кода */
        .code-inputs {
            margin-top: 10px;
            display: flex;
            gap: 14.5px;
            margin-bottom: 22px;
        }

        .code-inputs input {
            width: 64px;
            height: 64px;
            text-align: center;
            font-size: 1.8em;
            font-family: "Golos Text", sans-serif;
            font-weight: 600;
            background: #fff;
            border: none;
            border-radius: 4px;
            color: #080808;
            outline: none;
        }

        .overlay {
            position: fixed;
            top: 5%;
            left: 10%;
            width: 80%;
            height: 90%;
            background: rgba(8, 8, 8, 0.75);
            z-index: 2;
        }

        .code-inputs input:focus {
            box-shadow: 0 0 0 2px #02f0fe;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #2dc653;
            border: none;
            border-radius: 4px;
            font-family: "Golos Text", sans-serif;
            font-size: 25px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: background 0.21s;
        }

        .btn-primary:hover {
            background: #25a845;
        }

        .btn-primary:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .timer {
            margin-top: 20px;
            color: #aaa;
            font-size: 17px;
            text-align: center;
        }

        .timer span {
            color: #ffbf69;
            font-weight: 600;
        }

        .resend-btn {
            background: none;
            border: none;
            color: #02f0fe;
            cursor: pointer;
            font-family: "Golos Text", sans-serif;
            font-size: 17px;
            border-bottom: 1px solid rgba(2, 240, 254, 0.5);
            padding: 0;
            display: none;
            margin-top: 2px;
        }

        .resend-btn:hover {
            color: #ff3266;
        }

        .error {
            color: #ff3266;
            font-size: 17px;
            margin-top: 2px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="boarder">
        <img src="/img/handc.png" style="width:24px;height:24px;border-radius:50%;vertical-align:middle;">
        <a href="https://motovskikh.ru/">Леонид Мотовских</a>
        <a href="https://motovskikh.ru/thanks/">Задонатить</a>
        <a href="https://motovskikh.ru/en/">En</a>
    </div>

    <div class="overlay"></div>
    <div class="remal">
        <h1>Подтвердите вход в личный кабинет Мастерской</h1>
        <p class="subtitle">Код подтверждения отправлен на почту <span id="email-display"></span></p>
        <p class="subtitle">Подтвердите свою почту в течение 1 часа.</p>

        <div class="code-inputs">
            <input type="text" maxlength="1" inputmode="numeric" />
            <input type="text" maxlength="1" inputmode="numeric" />
            <input type="text" maxlength="1" inputmode="numeric" />
            <input type="text" maxlength="1" inputmode="numeric" />
            <input type="text" maxlength="1" inputmode="numeric" />
            <input type="text" maxlength="1" inputmode="numeric" />
        </div>

        <button class="btn-primary" id="submit-btn">Продолжить</button>

        <div class="error" id="error-msg"></div>

        <div class="timer">
            <span id="timer-text">Получить новый код через: <span id="countdown">01:00</span></span>
            <br>
            <button class="resend-btn" id="resend-btn">Получить новый код</button>
        </div>
    </div>

    <script src="/js/random.js"></script>
    <script>
        // Берём email из URL параметра
        const params = new URLSearchParams(window.location.search);
        const email = params.get("email") || "";
        document.getElementById("email-display").textContent = email;

        // Автопереход между инпутами
        const inputs = document.querySelectorAll(".code-inputs input");
        inputs.forEach((input, i) => {
            input.addEventListener("input", () => {
                // Оставляем только цифры
                input.value = input.value.replace(/\D/g, "");
                // Переходим к следующему инпуту
                if (input.value && i < inputs.length - 1) {
                    inputs[i + 1].focus();
                }
            });

            input.addEventListener("keydown", (e) => {
                if (e.key === "Backspace" && !input.value && i > 0) {
                    inputs[i - 1].focus();
                }
            });
        });

        // Таймер обратного отсчёта — 60 секунд
        let timeLeft = 60;
        const countdown = document.getElementById("countdown");
        const resendBtn = document.getElementById("resend-btn");
        const timerText = document.getElementById("timer-text");

        const timer = setInterval(() => {
            timeLeft--;
            const mins = Math.floor(timeLeft / 60).toString().padStart(2, "0");
            const secs = (timeLeft % 60).toString().padStart(2, "0");
            countdown.textContent = mins + ":" + secs;

            if (timeLeft <= 0) {
                clearInterval(timer);
                timerText.style.display = "none";
                resendBtn.style.display = "inline";
            }
        }, 1000);

        // Кнопка "Получить новый код"
        resendBtn.addEventListener("click", async () => {
            resendBtn.disabled = true;
            try {
                await fetch("/api/auth/resend-code", {
                    method: "POST",
                    headers: { "Content-Type": "application/json; charset=utf-8" },
                    body: JSON.stringify({ email })
                });
                // Перезагружаем страницу — таймер сбросится
                window.location.reload();
            } catch (err) {
                resendBtn.disabled = false;
            }
        });

        // Отправка кода
        document.getElementById("submit-btn").addEventListener("click", async () => {
            const code = Array.from(inputs).map(i => i.value).join("");
            if (code.length < 6) {
                const errorMsg = document.getElementById("error-msg");
                errorMsg.textContent = "Введите все 6 цифр кода";
                errorMsg.style.display = "block";
                return;
            }

            const btn = document.getElementById("submit-btn");
            const errorMsg = document.getElementById("error-msg")
            btn.disabled = true;
            btn.textContent = "Проверяем...";

            try {
                const response = await fetch("/api/auth/verify-email", {
                    method: "POST",
                    headers: { "Content-Type": "application/json; charset=utf-8" },
                    body: JSON.stringify({ email, code })
                });

                if (!response.ok) {
                    errorMsg.textContent = "Неверный или истёкший код";
                    errorMsg.style.display = "block";
                    btn.disabled = false;
                    btn.textContent = "Продолжить";
                    return;
                }

                window.location.href = "/dashboard.html";
            } catch (err) {
                const errorMsg = document.getElementById("error-msg");
                errorMsg.textContent = "Ошибка соединения с сервером";
                errorMsg.style.display = "block";
                btn.disabled = false;
                btn.textContent = "Продолжить";
            }
        });
    </script>
</body>

</html>
