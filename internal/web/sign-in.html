<!DOCTYPE html>
<html lang="ru">

<head>
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/imgn/favicon-16x16.png" />
    <link rel="manifest" href="/img/site.webmanifest" />
    <link rel="mask-icon" href="/img/safari-pinned-tab.svg" color="#5bbad5" />
    <link rel="shortcut icon" href="/img/favicon.ico" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в Мастерскую</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #080808;
            font-family: "Golos Text", sans-serif;
            font-size: 1.1em;
            color: #e9e9e9;
            min-height: 100vh;
            overflow: hidden;
        }

        .shape {
            opacity: 0.87;
            position: fixed;
            z-index: 1;
        }

        .circle {
            border-radius: 50%;
        }

        .square {
            border-radius: 0;
        }

        .triangle {
            background: transparent;
            border-left-color: transparent;
            border-right-color: transparent;
            border-top-width: 0;
            border-style: solid;
            height: 0;
            width: 0;
            opacity: 0.87;
            position: fixed;
            z-index: 1;
        }

        .triangle.red {
            border-bottom-color: #ff3266;
        }

        .triangle.green {
            border-bottom-color: #2dc4b6;
        }

        .triangle.blue {
            border-bottom-color: #20a4f3;
        }

        .triangle.yellow {
            border-bottom-color: #ffbf69;
        }

        .symmetric.red {
            background: #ff3266;
        }

        .symmetric.green {
            background: #2dc4b6;
        }

        .symmetric.blue {
            background: #20a4f3;
        }

        .symmetric.yellow {
            background: #ffbf69;
        }

        .triangle.western.windy {
            transform: rotate(-540deg);
        }

        .triangle.eastern.windy {
            transform: rotate(540deg);
        }

        .boarder {
            background: rgba(13, 13, 13, 0.72);
            border-radius: 20px;
            display: flex;
            padding: 6px 8px;
            position: fixed;
            right: 1.25%;
            top: 1%;
            z-index: 4;
            align-items: center;
            gap: 8px;
        }

        .boarder a {
            color: #02f0fe;
            text-decoration: none;
            border-bottom: 1px solid rgba(2, 240, 254, 0.5);
            font-size: 17px;
            padding: 3px 5px;
            transition: color 0.21s, border-color 0.21s;
        }

        .boarder a:hover {
            color: #ff3266;
            border-color: rgba(255, 50, 102, 0.5);
        }

        .overlay {
            position: fixed;
            top: 5%;
            left: 10%;
            width: 80%;
            height: 90%;
            background: rgba(8, 8, 8, 0.75);
            z-index: 2;
        }

        .remal {
            margin: 80px auto;
            max-width: 600px;
            position: relative;
            z-index: 3;
            padding: 0 20px;
        }


        .textrow {
            background: rgba(13, 13, 13, 0.85);
            padding: 30px;
            border-radius: 4px;
        }

        h1 {
            color: #ffbf69;
            font-size: 70px;
            margin-bottom: 6px;
            line-height: 1.1;
            letter-spacing: -1px;
        }

        .subtitle {
            color: #aaa;
            font-size: 0.95em;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #e9e9e9;
            font-size: 0.95em;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            background: #fff;
            border: none;
            border-radius: 4px;
            font-family: "Golos Text", sans-serif;
            font-size: 25px;
            color: #080808;
            margin-bottom: 8px;
            outline: none;
        }

        input:focus {
            box-shadow: 0 0 0 2px #02f0fe;
        }

        .forgot-link {
            display: block;
            text-align: right;
            margin-bottom: 16px;
            font-size: 0.85em;
            color: #02f0fe;
            text-decoration: none;
            border-bottom: 1px solid rgba(2, 240, 254, 0.5);
            width: fit-content;
            margin-left: auto;
            transition: color 0.21s;
        }

        .forgot-link:hover {
            color: #ff3266;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #2dc653;
            border: none;
            border-radius: 4px;
            font-family: "Golos Text", sans-serif;
            font-size: 25px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: background 0.21s;
            margin-bottom: 12px;
        }

        .btn-primary:hover {
            background: #25a845;
        }

        .btn-primary:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .btn-tg {
            width: 100%;
            padding: 14px;
            background: #2AABEE;
            border: none;
            border-radius: 4px;
            font-family: "Golos Text", sans-serif;
            font-size: 17px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: background 0.21s;
            margin-bottom: 8px;
        }

        .btn-tg:hover {
            background: #1a9bd8;
        }

        .error {
            color: #ff3266;
            font-size: 0.9em;
            margin-top: 12px;
            display: none;
        }

        .register-link {
            text-align: center;
            margin-top: 16px;
            font-size: 0.9em;
            color: #aaa;
        }

        .register-link a {
            color: #02f0fe;
            text-decoration: none;
            border-bottom: 1px solid rgba(2, 240, 254, 0.5);
        }

        .register-link a:hover {
            color: #ff3266;
            border-color: rgba(255, 50, 102, 0.5);
        }
    </style>
</head>

<body>
    <div class="boarder">
        <img src="/img/handc.png" style="width:24px;height:24px;border-radius:50%;vertical-align:middle;">
        <a href="https://motovskikh.ru/">Леонид Мотовских</a>
        <a href="https://motovskikh.ru/thanks/">Задонатить</a>
        <a href="https://motovskikh.ru/en/">En</a>
    </div>
    <div class="overlay"></div>
    <div class="remal">
        <div class="textrow">
            <h1>Вход в Мастерскую</h1>
            <p class="subtitle">Для полного доступа управления тестами.</p>

            <form id="signin-form">
                <input type="email" id="email" placeholder="your@email.com" required />

                <input type="password" id="password" placeholder="Ваш пароль" required />

                <a href="/forgot-password.html" class="forgot-link">Забыли пароль?</a>

                <button type="submit" class="btn-primary" id="submit-btn">Войти</button>

                <button type="button" class="btn-tg" id="tg-btn">Войти через Telegram</button>
            </form>

            <div class="error" id="error-msg"></div>

            <div class="register-link">
                Нет аккаунта? <a href="/register.html">Зарегистрироваться</a>
            </div>
        </div>
    </div>

    <script src="/js/random.js"></script>
    <script>
        document.getElementById("signin-form").addEventListener("submit", async function (e) {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const btn = document.getElementById("submit-btn");
            const errorMsg = document.getElementById("error-msg");

            errorMsg.style.display = "none";
            btn.disabled = true;
            btn.textContent = "Входим...";

            try {
                const response = await fetch("/api/auth/sign-in", {
                    method: "POST",
                    headers: { "Content-Type": "application/json; charset=utf-8" },
                    body: JSON.stringify({ name: email, pass: password })
                });

                if (response.status === 204) {
                    // Eсли email не подтверждён, отправляем на страницу верификации
                    window.location.href = "/verify-email.html?email=" + encodeURIComponent(email);
                    return;
                }

                if (!response.ok) {
                    errorMsg.textContent = "Неверный email или пароль";
                    errorMsg.style.display = "block";
                    btn.disabled = false;
                    btn.textContent = "Войти";
                    return;
                }

                // Куки установлены, идём в ЛК
                window.location.href = "/dashboard.html";

            } catch (err) {
                errorMsg.textContent = "Ошибка соединения с сервером";
                errorMsg.style.display = "block";
                btn.disabled = false;
                btn.textContent = "Войти";
            }
        });

        // Telegram заглушка
        document.getElementById("tg-btn").addEventListener("click", () => {
            alert("Вход через Telegram будет доступен позже");
        });
    </script>
</body>

</html>
